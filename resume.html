<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- header section -->
    <header>
        <div class="max-w-[100%]">
            <div class="w-[75%] mx-auto py-5 space-y-6">
                <div class="flex justify-between items-center">
                <h1 class="capitalize text-3xl">my portfolio</h1>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-terminal-icon lucide-square-terminal"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>
                </div>
            </div>
        </div>
    </header>

    <!-- navigation bar -->
    <nav>
        <div class="max-w-[100%]">
            <div class="w-[95%] md:w-[75%] mx-auto grid-cols-1">
                <div class="border rounded-full shadow-lg px-5 py-3">
                    <ul class="flex justify-evenly">
                        <a href="index.html">
                            <li class="capitalize hover:-translate-x-1 hover:text-blue-400">about</li>
                        </a>
                        <a href="skills.html">
                            <li class="capitalize hover:-translate-x-1 hover:text-blue-400">skills</li>
                        </a>
                        <a href="projects.html">
                            <li class="capitalize hover:-translate-x-1 hover:text-blue-400">Projects</li>
                        </a>
                        <a href="certificates.html">
                            <li class="capitalize hover:-translate-x-1 hover:text-blue-400">certificates</li>
                        </a>
                        <a href="resume.html">
                            <li class="capitalize hover:-translate-x-1 hover:text-blue-400">resume</li>
                        </a>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- resume section -->
    <section>
        <div class="max-w-[100%]">
            <div class="w-[95%] md:w-[75%] mx-auto mt-8 flex flex-col items-center gap-6">

                <!-- heading + download button -->
                <div class="flex justify-between items-center w-full">
                    <h2 class="text-2xl font-semibold capitalize">my resume</h2>
                    <a href="certificates/vimal-resume.pdf" download="certificates/vimal-resume.pdf">
                        <button class="border border-[#070707] hover:bg-[#070707] hover:text-[#fafcf9] px-6 py-2 rounded-lg shadow-lg flex flex-row items-center gap-2">
                            download
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </button>
                    </a>
                </div>

                <!-- embedded PDF -->
                <div class="w-full border shadow-lg rounded-lg overflow-hidden">
                    <iframe
                        src="certificates/vimal_resume.pdf"
                        class="w-full"
                        style="height: 90vh;"
                        type="application/pdf"
                    >
                        <p class="text-center p-4">Your browser doesn't support PDF preview.
                            <a href="certificates/vimal_resume.pdf" class="text-blue-500 underline">Click here to download it.</a>
                        </p>
                    </iframe>
                </div>

            </div>
        </div>
    </section>

    <!-- footer section -->
    <footer class="m-6">
        <div class="max-w-[100%]">
            <div class="w-[75%] mx-auto grid grid-cols-1">
                <div class="text-center">
                    <p class="font-[200]">© 2026 Vimal. All rights reserved. Built with passion and dedication.</p>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
